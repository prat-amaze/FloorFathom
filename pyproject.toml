[project]
name = "floorfathom"
version = "0.1.0"
description = "Handheld iPhone captures to dimensioned floor plans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "pydantic>=2",
    "matplotlib",
    "pycolmap",
    "torch",
    "transformers",
    "huggingface-hub",
    "pillow-heif",
]

[project.scripts]
floorfathom = "floorfathom.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floorfathom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
